[project]
name = "rpicar"
version = "0.1.0"
description = "Bluetooth-controlled relay drive service for a Raspberry Pi Zero W car"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Installed on the Pi only. lgpio wheels do not exist for every dev machine,
# so hardware support is deliberately not a hard dependency.
hw = ["lgpio>=0.2.2.0"]
# Pure-python asyncio D-Bus client, used to publish the SPP SDP record.
spp = ["dbus-next>=0.2.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
rpicar = "rpicar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# conftest is imported by name from the tests directory, which pytest puts on
# sys.path. Without this, isort files it under third-party.
known-first-party = ["rpicar", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
